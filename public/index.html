<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chatbot PMB Unanda</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        #chatbox { flex: 1; padding: 1rem; overflow-y: auto; }
        #chatbox div { margin-bottom: 0.5rem; }
        #inputArea { display: flex; border-top: 1px solid #ccc; }
        #userInput { flex: 1; padding: 0.5rem; border: none; }
        #sendBtn { padding: 0.5rem 1rem; border: none; background: #007bff; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div id="chatbox"></div>
    <div id="inputArea">
        <input id="userInput" type="text" placeholder="Ketik pesan..." onkeydown="if(event.key==='Enter') sendMessage()" />
        <button id="sendBtn" onclick="sendMessage()">Kirim</button>
    </div>
    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;
            appendMessage('Anda', message);
            input.value = '';
            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await res.json();
                appendMessage('Bot', data.answer || 'Tidak ada jawaban');
            } catch (e) {
                appendMessage('Bot', 'Gagal terhubung ke server');
            }
        }
        function appendMessage(sender, text) {
            const chatbox = document.getElementById('chatbox');
            const div = document.createElement('div');
            div.textContent = sender + ': ' + text;
            chatbox.appendChild(div);
            chatbox.scrollTop = chatbox.scrollHeight;
        }
    </script>
</body>
</html>
